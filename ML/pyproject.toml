# Poetry project file -- Render's Python runtime (which defaults to Poetry)
# uses this to install dependencies into the project virtualenv (.venv).
# Mirror of requirements.txt, kept in both places for local + Render parity.
[project]
name = "edu-growth-api"
version = "1.0.0"
description = "Edu Growth FastAPI + ML backend (CGPA / Risk / Mentor)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "pandas==3.0.5",
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "xgboost==3.2.0",
    "joblib==1.6.0",
    "psycopg2-binary==2.9.13",
]

[tool.poetry]
packages = [
    { include = "app" },
    { include = "ml_pipeline" },
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"