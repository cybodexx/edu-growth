# Render Blueprint -- one-click deploy of the FastAPI service.
# The app is 100% database-backed (Neon PostgreSQL); no CSV / local data files.
services:
  - type: web
    name: edu-growth-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
